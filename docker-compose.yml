services:
  mysql:
    image: mysql:8.0
    container_name: workflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: workflow_approval
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表（admin 账号由后端启动时初始化）
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: workflow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: workflow_approval
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      # 生产环境请覆盖为足够长的随机密钥
      JWT_SECRET: workflow-approval-prod-jwt-secret-key-change-me-0123456789abcdef
      JWT_EXPIRATION: 86400000
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      # 探测 8080 端口是否已监听（temurin 镜像自带 bash，使用 /dev/tcp，不依赖 curl/wget）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: workflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql-data:
