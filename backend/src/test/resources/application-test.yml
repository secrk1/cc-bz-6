spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: test-secret-key-test-secret-key-0123456789
  expiration: 3600000

logging:
  level:
    com.workflow.approval: warn
